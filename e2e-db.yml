services:
  test-db:
    image: postgres:13
    environment:
      POSTGRES_USER: package_e2e
      POSTGRES_PASSWORD: package_e2e
      POSTGRES_DB: package_e2e
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U package_e2e -d package_e2e"]
      interval: 2s
      timeout: 2s
      retries: 30
