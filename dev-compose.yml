services:
  package-db:
    image: postgres:13
    networks:
      package:
        aliases:
          - 'db'
    environment:
      - POSTGRES_USER=package
      - POSTGRES_PASSWORD=package
      - POSTGRES_DB=package
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U package']
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  package:
    driver: bridge
